# Development build of DOLFINx from git.
# Adapted from recipe/recipe.yaml (the conda-forge recipe in this repo).
# DEV_*_VERSION / DEV_DOLFINX_REV are set by dev/prepare.py in CI.
# Windows and complex builds are not built from this recipe (see dev/prepare.py).
context:
  name: fenics-dolfinx
  version: ${{ env.get("DEV_DOLFINX_VERSION", default="0.0.0.dev0") }}
  rev: ${{ env.get("DEV_DOLFINX_REV", default="main") }}
  build: 0
  # dev snapshots of the FEniCS components are built together: pin exactly
  basix_version: ${{ env.get("DEV_BASIX_VERSION", default="0.0.0.dev0") }}
  ffcx_version: ${{ env.get("DEV_FFCX_VERSION", default="0.0.0.dev0") }}
  ufl_version: ${{ env.get("DEV_UFL_VERSION", default="0.0.0.dev0") }}
  # Python Stable ABI (SABI with nanobind requires 3.12)
  abi3_tag: cp312
  abi3_python: "3.12"
  build_abi3: ${{ is_abi3 and match(python, abi3_python + ".*") }}
  skip_abi3: ${{ is_abi3 and match(python, ">=3.13") }}

  # nanobind abi:
  abi_version: 2.${{ nanobind_abi }}

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  git: https://github.com/FEniCS/dolfinx.git
  rev: ${{ rev }}

build:
  number: ${{ (build | int + 100) if scalar == 'real' else build }}
  skip: win or ppc64le or skip_abi3 or match(python, "<3.12")

outputs:
  - package:
      name: fenics-libdolfinx
    build:
      script: build-libdolfinx
      variant:
        use_keys:
          - python
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
        - ${{ compiler("cxx") }}
        - cmake
        - ninja
        - if: not win
          then:
            - pkg-config
        - if: "mpi == 'openmpi' and build_platform != target_platform"
          then: ${{ mpi }}
      host:
        - ${{ mpi | replace("impi", "impi-devel") }}
        - if: not win
          then:
            - libadios2
            - libadios2 * mpi_${{ mpi }}_*
            - kahip
            - parmetis
            - petsc
            - petsc * ${{ scalar }}_*
            - slepc
            - superlu_dist
        - libboost-devel
        - hdf5 ${{ hdf5 }}.* mpi_${{ mpi }}_*
        - libscotch
        - libptscotch
        - pugixml
        - fmt
        - spdlog
        - fenics-libbasix ==${{ basix_version }}
        - fenics-ufcx ==${{ ffcx_version }}
        - if: win
          # these shouldn't be required,
          # but are in INTERFACE_LINK_LIBRARIES for libscotch
          then:
            - zlib
            - liblzma-devel
      run:
        # these don't have run_exports
        # but are needed at runtime for code generation
        - fenics-ufcx ==${{ ffcx_version }}
        - if: not win
          then:
            - ${{ pin_compatible("parmetis", upper_bound="x.x") }}
        # needs boost metadata just to CMake-load fenix-libdolfinx
        - libboost-devel
        # need these to resolve cmake dependencies of libscotch
        # (only on windows)
        - if: win
          then:
            - zlib
            - liblzma-devel
      run_exports:
        weak:
          # dev snapshots are not ABI compatible with each other: pin exactly
          - ${{ pin_subpackage("fenics-libdolfinx", exact=True) }}
          - if: not win
            then:
              - petsc * ${{ scalar }}_*
          - ${{ mpi | replace("impi", "impi_rt") }}
    tests:
      - script:
          # rattler-build bug:
          # invoking .sh by default instead of .bat
          file: test-libdolfinx${{ ".bat" if win else "" }}
          env:
            target_platform: ${{ target_platform }}
        files:
          recipe:
            - if: win
              then: impi-toolchain.cmake
          source:
            - cpp/test/
        requirements:
          run:
            - ${{ compiler("c") }}
            - ${{ compiler("cxx") }}
            - if: linux and target_platform != build_platform
              then:
                # __glibc virtual package seems to resolve wrong on emulated linux
                - ${{ stdlib("c") }}
            - if: win
              then: impi-devel
            - pkg-config
            - cmake
            - catch2 3.*
            - ninja
            - fenics-ffcx ==${{ ffcx_version }}

  - package:
      name: fenics-dolfinx
    build:
      script:
        file: build-dolfinx
        env:
          SKBUILD_WHEEL_PY_API: ${{ "cp312" if build_abi3 else "" }}
      python:
        version_independent: ${{ build_abi3 }}
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
        - ${{ compiler("cxx") }}
        - cmake
        - ninja
        - pkg-config
        - fenics-basix-nanobind-abi ${{ abi_version }}.*
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - nanobind
            - nanobind-abi
            - if: mpi == 'openmpi'
              then: ${{ mpi }}
      host:
        - ${{ mpi | replace("impi", "impi-devel") }}
        # hdf5 shouldn't be needed here, but solver fails without it
        - hdf5 ${{ hdf5 }}.* mpi_${{ mpi }}_*
        - ${{ pin_subpackage("fenics-libdolfinx", exact=True) }}
        - python
        - if: build_abi3
          then:
            - python-abi3
        - pip
        - scikit-build-core
        - wheel
        - nanobind
        - nanobind-abi
        - fenics-basix ==${{ basix_version }}
        - fenics-basix-nanobind-abi ${{ abi_version }}.*
        - mpi4py
        - if: not win
          then:
            - petsc * ${{ scalar }}_*
            - petsc4py
            - slepc
            - slepc4py
        # not actually a dependency of the Python part, but having it here
        # seems to fix a solver error on libxml2's noicu build
        - libboost-devel
      run:
        # code generation only needs c, not cxx
        # get implementation, not full activation package
        # need unqualified 'gcc' to get `gcc` executable
        - if: win
          then:
            # windows only has activation
            - ${{ compiler("c") }}
          else:
            - ${{ c_compiler | default("bot") }} >=${{ c_compiler_version | default("0") }}
        - pkg-config
        - ${{ pin_subpackage("fenics-libdolfinx", exact=True) }}
        - cffi
        - mpi4py
        - numpy >=2
        - if: not win
          then:
            - petsc4py
            - slepc4py
        - fenics-basix ==${{ basix_version }}
        - fenics-ffcx ==${{ ffcx_version }}
        - fenics-ufl ==${{ ufl_version }}
    tests:
      - script:
          # rattler-build bug:
          # invoking .sh by default instead of .bat
          file: test-dolfinx${{ ".bat" if win else "" }}
          env:
            scalar: ${{ scalar }}
            target_platform: ${{ target_platform }}
        files:
          recipe:
            - test_dolfinx.py
          source:
            # pyproject 0.10 is incompatible with current pytest
            # - python/pyproject.toml
            - python/demo/
            - python/test/
        requirements:
          run:
            - python ${{ "3.13.*" if build_abi3 else "" }}
            - pip
            - pytest >=6
            - if: win
              then:
                # workaround pip check on Windows
                - colorama
            - python-gmsh
            - if: linux and aarch64
              then:
                - libgl-devel
            - if: linux and target_platform != build_platform
              then:
                # __glibc virtual package seems to resolve wrong on emulated linux
                - ${{ stdlib("c") }}
            - sympy
            - scipy
            - matplotlib-base
      - if: build_abi3
        then:
          - if: unix
            then:
              - script:
                  - abi3audit $PREFIX/lib/python3.13/site-packages/dolfinx/*.so --assume-minimum-abi3 3.12
                  - python3 -c 'import dolfinx'
                requirements:
                  run:
                    - abi3audit
                    - python 3.13.*

about:
  summary: The computational environment of FEniCSx (development build from git main)
  description: |
    DOLFINx is the computational environment of FEniCSx
    and implements the FEniCS Problem Solving Environment in Python and C++.
  license: LGPL-3.0-or-later
  license_file: COPYING.LESSER
  homepage: https://fenicsproject.org
  repository: https://github.com/fenics/dolfinx
  documentation: https://docs.fenicsproject.org/dolfinx/main/

